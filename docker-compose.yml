services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-notebook-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - rag-net

  ollama-setup:
    image: ollama/ollama:latest
    container_name: local-notebook-ollama-setup
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull nomic-embed-text
        ollama pull qwen2.5:7b
        echo "Ollama models ready: nomic-embed-text, qwen2.5:7b"
    restart: "no"
    networks:
      - rag-net

  n8n:
    image: n8nio/n8n:latest
    container_name: local-notebook-n8n
    ports:
      - "5678:5678"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres-db
      - ollama
    restart: unless-stopped
    networks:
      - rag-net

  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: local-notebook-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=rag_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=rag_secure_pass_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - rag-net

volumes:
  n8n_data:
  postgres_data:
  ollama_data:

networks:
  rag-net:
    driver: bridge